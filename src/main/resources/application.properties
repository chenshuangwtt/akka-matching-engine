matching.persistence.enabled=true
matching.persistence.dir=data/events
matching.persistence.snapshot-threshold=1000
matching.persistence.compact-low-load-open-orders=64

matching.preload-symbols=BTC/USDT,ETH/USDT,SOL/USDT,BTC/USDC,ETH/USDC

grpc.server.port=50051

logging.pattern.level=%5p [requestId=%X{requestId:-} clientOrderId=%X{clientOrderId:-}]

matching.max-historical-orders-per-symbol=100000
matching.max-in-flight-requests=1000
