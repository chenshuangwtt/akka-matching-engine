# Akka 核心配置入口
akka {
  # 日志级别：INFO / DEBUG / WARNING / ERROR
  loglevel = "INFO"

  actor {

    # 默认调度器（所有Actor如果不指定，都用这个）
    default-dispatcher {
      executor = "fork-join-executor"  # 线程池类型：fork-join 适合异步计算
      throughput = 30                   # 一个Actor一次能处理多少条消息再切换线程，提高吞吐量

      fork-join-executor {
        parallelism-min = 4            # 最小线程数
        parallelism-factor = 1.0       # 按CPU核心数倍数计算线程数（1.0=核心数*1）
        parallelism-max = 8            # 最大线程数
      }
    }

    # 自定义调度器：专门给 匹配规则Actor / 引擎Actor 使用的调度器
    # 需要在创建Actor时手动指定：withDispatcher("akka.actor.matching-dispatcher")
    matching-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"

      # 撮合Actor推荐优先压测这个值：100 / 300 / 1000
      throughput = 300

      # 邮箱类型：有界非阻塞邮箱，避免消息无限堆积
      mailbox-type = "akka.dispatch.NonBlockingBoundedMailbox"
      # 邮箱最大容量：建议优先压测 1000 / 5000 / 20000
      mailbox-capacity = 5000

      fork-join-executor {
        parallelism-min = 4
        parallelism-factor = 1.0
        parallelism-max = 16
      }
    }

    # benchmark 可以单独使用更激进的调度器，避免和应用默认配置混在一起
    benchmark-dispatcher {
      type = Dispatcher
      executor = "fork-join-executor"
      throughput = 1000
      mailbox-type = "akka.dispatch.NonBlockingBoundedMailbox"
      mailbox-capacity = 20000

      fork-join-executor {
        parallelism-min = 4
        parallelism-factor = 1.0
        parallelism-max = 16
      }
    }

    # 如果后续把持久化改成更重的同步I/O，建议切到这类独立 dispatcher
    persistence-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      throughput = 1
      mailbox-type = "akka.dispatch.NonBlockingBoundedMailbox"
      mailbox-capacity = 1000

      thread-pool-executor {
        fixed-pool-size = 2
      }
    }
  }

  # 死信日志：输出前20条死信（消息发给了已停止的Actor），方便排查丢失问题
  log-dead-letters = 20
  # 关闭关闭过程中的死信日志（避免停机时刷屏）
  log-dead-letters-during-shutdown = off
}
